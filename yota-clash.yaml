allow-lan: false
mode: rule
log-level: info
ipv6: false

proxies:
  - name: node-01-vless
    type: vless
    server: 199.232.78.120
    port: "443"
    uuid: 8d2cbffd-43d0-458d-906b-7c54b7b51f38
    network: ws
    tls: true
    udp: true
    servername: cdn.akamai.steamstatic.com
    skip-cert-verify: true
    client-fingerprint: chrome
    ws-opts:
      path: /
      headers:
        Host: ushetzijji.global.ssl.fastly.net.
  - name: node-02-vless
    type: vless
    server: 156.229.167.109
    port: "8443"
    uuid: eb8c97f7-a154-4442-91b0-54c0d055ad0b
    network: tcp
    tls: true
    udp: true
    reality-opts:
      public-key: 4g6gX0ueJap7pY_iTDx23h6bzo3KIOTcFzP1Uacn0QA
      short-id: 4ad2e4e660550e43
    servername: github.githubassets.com
    client-fingerprint: chrome
  - name: node-03-anytls
    type: anytls
    server: anytls2.864106.xyz
    port: "19000"
    password: github.com/Alvin9999-newpac/fanqiang
    sni: anytls2.864106.xyz
    skip-cert-verify: true
    client-fingerprint: chrome
    udp: true

proxy-groups:
  - name: AUTO
    type: url-test
    url: 'https://www.gstatic.com/generate_204'
    interval: 120
    tolerance: 80
    lazy: false
    proxies:
      - node-01-vless
      - node-02-vless
      - node-03-anytls
  - name: FALLBACK
    type: fallback
    url: 'https://www.gstatic.com/generate_204'
    interval: 120
    proxies:
      - AUTO
      - node-01-vless
      - node-02-vless
      - node-03-anytls

rules:
  - DOMAIN-SUFFIX,local,DIRECT
  - IP-CIDR,192.168.0.0/16,DIRECT,no-resolve
  - IP-CIDR,10.0.0.0/8,DIRECT,no-resolve
  - IP-CIDR,172.16.0.0/12,DIRECT,no-resolve
  - IP-CIDR,127.0.0.0/8,DIRECT,no-resolve
  - GEOIP,RU,DIRECT
  - GEOSITE,category-ru,DIRECT
  - MATCH,FALLBACK
