mixed-port: 7890
allow-lan: false
mode: rule
log-level: info
ipv6: false

proxies:
  - name: node-01-vless
    type: vless
    server: lodizu.hagrid-connected.com
    port: "443"
    uuid: beda6bd0-7ce4-477a-91f1-860d018dbfcb
    network: tcp
    tls: true
    udp: true
    flow: xtls-rprx-vision
    servername: lodizu.hagrid-connected.com
    skip-cert-verify: true
    client-fingerprint: firefox
    alpn:
      - h2
      - http/1.1
  - name: node-02-hysteria2
    type: hysteria2
    server: 5.181.219.131
    port: "8443"
    password: w6qsn04S8jKUCJZRhVimSQ==
    sni: bing.com
    skip-cert-verify: true
    udp: true

proxy-groups:
  - name: AUTO
    type: url-test
    url: 'https://www.gstatic.com/generate_204'
    interval: 120
    tolerance: 80
    lazy: false
    proxies:
      - node-01-vless
      - node-02-hysteria2
  - name: FALLBACK
    type: fallback
    url: 'https://www.gstatic.com/generate_204'
    interval: 120
    proxies:
      - AUTO
      - node-01-vless
      - node-02-hysteria2

rules:
  - DOMAIN-SUFFIX,local,DIRECT
  - IP-CIDR,192.168.0.0/16,DIRECT,no-resolve
  - IP-CIDR,10.0.0.0/8,DIRECT,no-resolve
  - IP-CIDR,172.16.0.0/12,DIRECT,no-resolve
  - IP-CIDR,127.0.0.0/8,DIRECT,no-resolve
  - GEOIP,RU,DIRECT
  - GEOSITE,category-ru,DIRECT
  - MATCH,FALLBACK
