      - node-01-vless
      - node-02-vless
      - node-03-vless
      - node-04-vless
      - node-05-vless
  - name: FALLBACK
    type: fallback
    url: 'https://www.gstatic.com/generate_204'
    interval: 120
    proxies:
      - AUTO
      - node-01-vless
      - node-02-vless
      - node-03-vless
      - node-04-vless
      - node-05-vless

rules:
